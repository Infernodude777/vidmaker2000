<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vidmaker2000</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<style>
  :root{
    --bg:#0f0e17; --panel:#191827; --ink:#fffffe; --muted:#a7a9be;
    --orange:#ff8906; --violet:#7f5af0; --mint:#2cb67d;
  }
  *{box-sizing:border-box}
  body{
    background:radial-gradient(1200px 700px at 20% -10%, #241b3a 0%, var(--bg) 55%);
    color:var(--ink); min-height:100vh; margin:0; display:flex;
    align-items:center; justify-content:center;
    font-family:"Cascadia Code","JetBrains Mono",ui-monospace,Consolas,monospace;
  }
  .box{text-align:center; max-width:560px; padding:32px}
  .logo{display:inline-flex; align-items:center; gap:14px}
  .logo img{width:56px; height:56px; filter:drop-shadow(0 0 14px rgba(255,137,6,.45))}
  h1{
    color:var(--orange); letter-spacing:5px; margin:0; font-size:34px; font-weight:800;
  }
  h1 span{color:var(--violet)}
  p.tag{color:var(--muted); margin:10px 0 22px; letter-spacing:1px}
  .bar{
    width:260px; height:6px; background:#232136; margin:0 auto 18px;
    border-radius:99px; overflow:hidden; position:relative;
  }
  .bar>div{
    height:100%; width:38%; border-radius:99px;
    background:linear-gradient(90deg, var(--orange), var(--violet));
    animation:slide 1.1s infinite alternate ease-in-out;
  }
  @keyframes slide{from{margin-left:-15%}to{margin-left:77%}}
  .pips{display:flex; gap:8px; justify-content:center; margin-bottom:18px}
  .pip{
    width:8px; height:8px; border-radius:99px; background:#232136;
    animation:pulse 1.2s infinite ease-in-out;
  }
  .pip:nth-child(2){animation-delay:.15s}
  .pip:nth-child(3){animation-delay:.3s}
  .pip:nth-child(4){animation-delay:.45s}
  @keyframes pulse{0%,100%{background:#232136}50%{background:var(--mint)}}
  .features{color:var(--muted); font-size:12px; line-height:1.9}
  .features b{color:var(--ink); font-weight:600}
  small{color:var(--mint)}
</style>
</head>
<body><div class="box">
  <div class="logo">
    <img src="/favicon.svg" alt="">
    <h1>VID<span>MAKER</span>2000</h1>
  </div>
  <p class="tag">neon cuts, zero friction</p>
  <div class="bar"><div></div></div>
  <div class="pips"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
  <div class="features">
    <b>grade</b> &amp; LUTs &nbsp;&middot;&nbsp; <b>transitions</b> &amp; captions<br>
    <b>scene split</b> &nbsp;&middot;&nbsp; <b>beat snap</b> &nbsp;&middot;&nbsp; <b>media library</b><br>
    queue exports &middot; autosave snapshots &middot; full keyboard map
  </div>
  <br>
  <small>v2.1 &middot; warming up the frame pipeline</small>
</div></body>
</html>
